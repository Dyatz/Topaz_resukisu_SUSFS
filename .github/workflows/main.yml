name: "Build Cryo-Daily  (Daily Driver)"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-kernels:
    name: "❄️ Build Cryo ${{ matrix.kernel.name }} kernel"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-GKI"
            output_name: "Image"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/yougotme101/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-CLO"
            output_name: "Image"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/yougotme101/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-GKI"
            output_name: "Image"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/yougotme101/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "CLO-NoKSU"
            dir: "common_clo_noksu"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-CLO"
            output_name: "Image"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/yougotme101/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: 🧹 Aggressive Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo docker builder prune -a -f
          
      - name: 📐 Setup SWAP 20GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 20
            
      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1
            
      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Initialize AOSP repo
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8
          
          # Clean up existing repo and common directories
          rm -rf .repo
          rm -rf common

          # Download and setup custom clang toolchain
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          # Remove unused clang for more space
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-r596125
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          # Update build config constants
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          
          # Remove defconfig check (if exists)
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true
      
      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # Fix localversion
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/g' "$CONFIG_FILE" || true
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"

          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            
            # Cek apakah patch sudah terpasang (Logika pintar dari Claude)
            if patch -p1 -R --dry-run -s -f < "$file" > /dev/null 2>&1; then
              echo "✅ Sudah terpasang, dilewati: $file"
            else
              # Jika belum terpasang, paksa pasang. Jika gagal, HENTIKAN BUILD (Rem darurat)
              patch -p1 --batch < "$file" || { echo "::error::Hunks failed in $file (Konflik kode serius!)"; exit 1; }
              echo "✅ Berhasil dipasang: $file"
            fi
            rm -f "$file"
          }
          
          apply_patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"

          echo '${{ toJSON(matrix.kernel.extra_patches) }}' | jq -r '.[]' | while read p; do
            [ -n "$p" ] && apply_patch "$p"
          done

          # Use scripts/config for safe config manipulation
          scripts/config --file "$CONFIG_FILE" \
            -e CONFIG_KALLSYMS \
            -e CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE \
            -e CONFIG_TCP_CONG_ADVANCED \
            -d CONFIG_TCP_CONG_BIC \
            -d CONFIG_TCP_CONG_HTCP \
            -e CONFIG_TCP_CONG_WESTWOOD \
            -e CONFIG_TCP_CONG_BBR \
            -e CONFIG_DEFAULT_BBR \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_TMPFS_XATTR \
            -e CONFIG_TMPFS_POSIX_ACL \
            -e CONFIG_WQ_POWER_EFFICIENT_DEFAULT \
            -e CONFIG_PM_WAKELOCKS \
            --set-val CONFIG_PM_WAKELOCKS_LIMIT 100 \
            -e CONFIG_PM_WAKELOCKS_GC \
            -e CONFIG_SUSPEND \
            -e CONFIG_SUSPEND_FREEZER \
            -e CONFIG_CRYPTO_LZ4 \
            -e CONFIG_KERNEL_LZ4 \
            -e ZRAM_DEF_COMP_LZ4 \
            -d CONFIG_KERNEL_GZIP \
            -d CONFIG_KERNEL_LZO \
            -d CONFIG_KERNEL_XZ
          
          # Remove duplicate lines safely
          sed -i '/ZRAM_DEF_COMP_LZO/d' "$CONFIG_FILE" || true

      - name: "🚀 Add Droidspaces Support (fix KABI sysvipc)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          curl -sL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch" | git apply -v --ignore-whitespace || { echo "::error::Droidspaces patch failed"; exit 1; }
          
      - name: "😋 Add BBG Support"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          scripts/config --file arch/arm64/configs/${{ env.DEFCONFIG_NAME }} -e CONFIG_BBG
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: "🔧 Setup KSU with SUSFS"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          if grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c; then
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
            NS_FAKE_PATCHED=1
          fi

          if grep -q '^#include <trace/hooks/mm.h>$' fs/proc/task_mmu.c; then
            sed -i '/^#include <trace\/hooks\/mm.h>$/d' fs/proc/task_mmu.c
            MM_FAKE_PATCHED=1
          fi
          
          patch -p1 < "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" || { echo "::error::SUSFS patch failed"; exit 1; }
          
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ] && cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          
          rm -rf susfs4ksu
          [ ! -L "drivers/kernelsu" ] && ln -sf ../KernelSU drivers/kernelsu

          scripts/config --file arch/arm64/configs/${{ env.DEFCONFIG_NAME }} \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_SUS_MAP

          if [ "$NS_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/blk.h' fs/namespace.c; then
            sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c || true
          fi

          if [ "$MM_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/mm.h' fs/proc/task_mmu.c; then
            sed -i '/^#include <linux\/pkeys.h>$/a #include <trace/hooks/mm.h>' fs/proc/task_mmu.c || true
          fi

      - name: "📝 Append custom Makefile line"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
         echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile

      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=full \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "📦 Package AnyKernel3"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Download fresh AnyKernel3 specific for this matrix run
          git clone --depth=1 https://github.com/yougotme101/AnyKernel3 -b YASK AK3_${{ matrix.kernel.name }}
          
          # Copy the compiled Image to AK3 folder
          cp out/dist/Image AK3_${{ matrix.kernel.name }}/Image
          
          cd AK3_${{ matrix.kernel.name }}
          
          # Create banner
          cat > banner << 'EOF'
          ╔═════════════════════════════════════════════════════╗
          ║                           __                        ║
          ║                           ##                        ║
          ║                          ####                       ║
          ║                         ##""##                      ║
          ║                        ##"  "##                     ║
          ║          ___           ##_  _##           ___       ║
          ║          "#########_    "####"    _#########"       ║
          ║            ##_   "##_    "##"    _##"   _##         ║
          ║             "##_   ##_  _ ## _  _##   _##"          ║
          ║               ########__######__########            ║
          ║                       _########_                    ║
          ║                       "########"                    ║
          ║               ########""######""########            ║
          ║             _##"   ##"  " ## "  "##   "##_          ║
          ║            ##"   _##"    _##_    "##_   "##         ║
          ║          _#########"    _####_    "#########_       ║
          ║          """           ##"  "##           """       ║
          ║                        ##_  _##                     ║
          ║                         ##__##                      ║
          ║                          ####                       ║
          ║                           ##                        ║
          ║                           ""                        ║
          ║                                                     ║
          ║                     CRYO Kernel                     ║
          ║                    by @Dyatz 685                    ║
          ║                                                     ║
          ║              Powered by Github Actions              ║
          ║                                                     ║
          ╠═════════════════════════════════════════════════════╣
          ║                                                     ║
          ║     Features:                                       ║
          ║     • Daily Driver Optimized                        ║
          ║     • Full LTO + -O2 Optimization                   ║
          ║     • AOSP clang-r547379                            ║
          ║     • Droidspaces Support                           ║
          ║     • Baseband-guard v1 Support                     ║
          ║     • Vanilla & BakaSU (Multi Manager Support).     ║
          ║     • Integrated with SUSFS (GKI A13-5.15)          ║
          ║                                                     ║
          ║     Please ensure:                                  ║
          ║     • Your device is compatible                     ║
          ║     • You have a backup of your current kernel      ║
          ║                                                     ║
          ╚═════════════════════════════════════════════════════╝
          Installing Cryo Kernel...
          EOF
          
          # Zip the contents
          ZIP_NAME="AK3_Cryo_${{ matrix.kernel.name }}_$(date +'%Y%m%d').zip"
          zip -r9 "../$ZIP_NAME" * -x .git/*
          echo "Created $ZIP_NAME"
          
      - name: "📤 Upload kernel ZIP artifact"
        uses: actions/upload-artifact@v4
        with:
          name: AK3_Cryo_${{ matrix.kernel.name }}
          path: ${{ env.WORK_DIR }}/AK3_Cryo_${{ matrix.kernel.name }}_*.zip
          retention-days: 3
          
