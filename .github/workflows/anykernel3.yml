name: Bungkus AnyKernel3

# Workflow TERPISAH dari build kernel.
# Jalankan SETELAH workflow build kernel selesai hijau.
# Tugasnya: ambil file Image dari build itu, pastikan itu kernel arm64,
# lalu bungkus jadi zip AnyKernel3 untuk perangkat arm64 dengan slot A/B.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID run build (angka di akhir URL run). Kosongkan = pakai build sukses terakhir"
        required: false
        default: ""
      zip_name:
        description: "Nama file zip (tanpa .zip)"
        required: false
        default: "Kernel-ReSukiSU-SUSFS"
      device_names:
        description: "Opsional: codename perangkat, pisahkan spasi/koma, maks 5 (contoh: topaz tapas). Kosong = tanpa cek nama"
        required: false
        default: ""
      strict_check:
        description: "Cek di HP saat flash: wajib arm64 dan slot A/B (matikan hanya kalau deteksi salah)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  # Paksa semua action JavaScript berjalan di Node.js 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Tentukan run build yang dipakai
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            for WF in "Build CLO Kernel + ReSukiSU + SUSFS" main.yml build.yml; do
              RUN_ID=$(gh run list --workflow="$WF" --status=success --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
              [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] && break
              RUN_ID=""
            done
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::Belum ada build yang sukses. Jalankan workflow build dulu sampai hijau, atau isi run_id secara manual."
            exit 1
          fi
          echo "Pakai build run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Unduh Image dari build
        uses: actions/download-artifact@v8
        with:
          name: kernel-image
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: image

      - name: Pastikan Image adalah kernel arm64
        run: |
          python3 - <<'PYCHK'
          import os, sys
          p = "image/Image"
          if not os.path.isfile(p):
              print("::error::File image/Image tidak ada di artifact kernel-image")
              sys.exit(1)
          with open(p, "rb") as f:
              head = f.read(64)
          size = os.path.getsize(p)
          # Header kernel arm64: magic "ARM\x64" di offset 56
          if len(head) < 64 or head[56:60] != b"ARM\x64":
              print("::error::Bukan kernel arm64: magic ARM64 tidak ditemukan di offset 56")
              print("::error::(file mungkin terkompresi, mis. Image.gz, atau bukan arm64)")
              sys.exit(1)
          if size < 4 * 1024 * 1024:
              print(f"::error::Ukuran Image terlalu kecil ({size} byte), build kemungkinan rusak")
              sys.exit(1)
          print(f"Image arm64 valid, ukuran {size / 1048576:.1f} MiB")
          PYCHK

      - name: Bungkus AnyKernel3
        id: pack
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
          DEVICE_NAMES: ${{ inputs.device_names }}
          STRICT: ${{ inputs.strict_check }}
        run: |
          # buang karakter aneh dari nama supaya aman dipakai sebagai nama file
          ZIP_NAME=$(printf '%s' "${ZIP_NAME:-Kernel-ReSukiSU-SUSFS}" | tr -cd 'A-Za-z0-9._-')
          [ -n "$ZIP_NAME" ] || ZIP_NAME=Kernel-ReSukiSU-SUSFS

          # cek nama perangkat (opsional, maks 5 sesuai batas AnyKernel3)
          DEVCHECK=0
          PROPS_DEV=""
          i=1
          for n in $(printf '%s' "$DEVICE_NAMES" | tr ',' ' ' | tr -cd 'A-Za-z0-9._ -'); do
            [ "$i" -le 5 ] || break
            PROPS_DEV="${PROPS_DEV}device.name${i}=${n}"$'\n'
            DEVCHECK=1
            i=$((i + 1))
          done

          STRICT_VAL=1
          [ "$STRICT" = "false" ] && STRICT_VAL=0
          echo "devicecheck=$DEVCHECK strict_check=$STRICT_VAL"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp image/Image AnyKernel3/Image
          cd AnyKernel3

          # anykernel.sh bawaan hanyalah contoh (Galaxy Nexus). Diganti versi bersih:
          # hanya ganti kernel di partisi boot slot aktif, ramdisk tidak disentuh.
          {
            cat <<EOF
          ### AnyKernel3 - arm64, perangkat A/B (ganti kernel saja)
          properties() { '
          kernel.string=Kernel + ReSukiSU + SUSFS
          do.devicecheck=${DEVCHECK}
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          ${PROPS_DEV}supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          STRICT_CHECK=${STRICT_VAL};
          EOF
            cat <<'AKEOF'

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # pemeriksaan perangkat: wajib arm64 dan A/B
          ab_slot="";
          if [ "$STRICT_CHECK" = 1 ]; then
            ui_print " ";
            ui_print "Memeriksa perangkat...";

            ck_abi="$(getprop ro.product.cpu.abi 2>/dev/null)";
            ck_abilist="$(getprop ro.product.cpu.abilist 2>/dev/null)";
            ck_mach="$(uname -m 2>/dev/null)";
            case "$ck_abi $ck_abilist $ck_mach" in
              *arm64*|*aarch64*|*armv8*) ui_print "  Arsitektur : arm64 (OK)";;
              "  ") ui_print "  Arsitektur : tidak terdeteksi, dilanjutkan";;
              *) abort "Perangkat bukan arm64 ($ck_abi $ck_abilist $ck_mach). Zip ini hanya untuk arm64.";;
            esac;

            ab_slot="$(getprop ro.boot.slot_suffix 2>/dev/null)";
            [ "$ab_slot" ] || ab_slot="$(grep -o 'androidboot.slot_suffix=[^ ]*' /proc/cmdline 2>/dev/null | cut -d= -f2)";
            if [ ! "$ab_slot" ]; then
              ck_s="$(getprop ro.boot.slot 2>/dev/null)";
              [ "$ck_s" ] || ck_s="$(grep -o 'androidboot.slot=[^ ]*' /proc/cmdline 2>/dev/null | cut -d= -f2)";
              [ "$ck_s" ] && ab_slot="_$ck_s";
            fi;
            ck_ab=0;
            case "$ab_slot" in
              _a|_b) ck_ab=1;;
            esac;
            if [ "$ck_ab" != 1 ]; then
              for ck_p in /dev/block/by-name/boot_a /dev/block/bootdevice/by-name/boot_a; do
                [ -e "$ck_p" ] && ck_ab=1;
              done;
            fi;
            if [ "$ck_ab" = 1 ]; then
              ui_print "  Partisi    : A/B (OK)${ab_slot:+ $ab_slot}";
            else
              abort "Perangkat bukan A/B (slot tidak terdeteksi). Zip ini hanya untuk perangkat A/B.";
            fi;
          fi;

          # boot install (tanpa unpack/repack ramdisk)
          split_boot;
          flash_boot;

          ui_print " ";
          ui_print "Kernel dipasang ke slot aktif${ab_slot:+ $ab_slot}. Reboot untuk memakainya.";
          AKEOF
          } > anykernel.sh

          sh -n anykernel.sh || { echo "::error::anykernel.sh hasil generate punya kesalahan sintaks"; exit 1; }
          echo "--- anykernel.sh:"; cat anykernel.sh

          rm -rf .git .github README.md
          zip -r9 "../${ZIP_NAME}.zip" ./*
          cd ..
          ls -lh "${ZIP_NAME}.zip"
          echo "zip=${ZIP_NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
